[project]
name = "tracegraph"
version = "0.1.0"
description = "Buyer agents that share one FalkorDB evidence graph and act on it, built on the TRACE trust-routing paper"
readme = "README.md"
authors = [
    { name = "Nikunj Kaushik", email = "nikunjkaushik28@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "falkordb>=1.8.0",
    "fastapi>=0.143.1",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[project.scripts]
tracegraph-agent-eval = "tracegraph.eval.agent_cli:run_agent_evals"
tracegraph-api = "tracegraph.api.server:run"
tracegraph-mcp = "tracegraph.agent.mcp_server:run_stdio"
tracegraph-scoreboard = "tracegraph.eval.cli:run_scoreboard"
tracegraph-seed = "tracegraph.market.cli:seed_demo"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["falkordb.*", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["falkordb: needs a running FalkorDB (skipped when it is not reachable)"]
