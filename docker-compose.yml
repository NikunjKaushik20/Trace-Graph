services:
  falkordb:
    image: falkordb/falkordb:v4.22.0
    ports:
      - "6379:6379"
      - "3000:3000"
    environment:
      REDIS_ARGS: "--appendonly yes --appendfsync everysec"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  falkordb-data:
